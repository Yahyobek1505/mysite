# main'ga push qilinganda saytni serverga avtomatik yuklaydi
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: SSH sozlash
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Fayllarni serverga yuklash
        run: |
          rsync -az --delete \
            --exclude '.git*' \
            --exclude '.github' \
            --exclude '.claude' \
            --exclude 'CLAUDE.md' \
            --exclude 'sayt-bloklash' \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/var/www/yahyohon.uz/
